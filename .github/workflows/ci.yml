name: CI

on:
  # Run on PRs only. The post-merge commit on `main` is identical to the PR head
  # that already passed these checks, so re-running on `push: main` only burns
  # Actions minutes. Branch protection (required status checks) gates merges.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      landing: ${{ steps.filter.outputs.landing }}
      demo: ${{ steps.filter.outputs.demo }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
            landing:
              - 'munaxalanding/**'
            demo:
              - 'munaxademo/**'

  node:
    name: Lint · Typecheck · Test · Build (JS/TS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: munaxa
          POSTGRES_PASSWORD: munaxa_ci
          POSTGRES_DB: munaxa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U munaxa"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Runtime/tests connect as the restricted, NOBYPASSRLS app role so RLS is enforced.
      DATABASE_URL: postgresql://munaxa_app:munaxa_app_dev@localhost:5432/munaxa?schema=public
      # Migrations connect as the privileged owner.
      DIRECT_DATABASE_URL: postgresql://munaxa:munaxa_ci@localhost:5432/munaxa?schema=public
      # psql rejects the Prisma-specific "schema" query param; use a clean libpq URI.
      PSQL_DIRECT_URL: postgresql://munaxa:munaxa_ci@localhost:5432/munaxa
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Build internal packages
        run: pnpm turbo run build --filter=@munaxa/domain --filter=@munaxa/contracts --filter=@munaxa/utils

      - name: Apply database migrations
        run: pnpm --filter @munaxa/api prisma:deploy

      - name: Provision restricted application role
        run: psql "$PSQL_DIRECT_URL" -v ON_ERROR_STOP=1 -f infra/postgres/app-role.sql

      - name: Seed database
        run: pnpm --filter @munaxa/api db:seed

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Integration tests (DB / RLS)
        run: pnpm --filter @munaxa/api test:e2e

      - name: Build
        run: pnpm build

  flutter:
    name: Analyze · Test (Flutter)
    runs-on: ubuntu-latest
    # The Flutter SDK download + analyze/test is the most expensive job. Only run it
    # when mobile code actually changed.
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare platform folders
        working-directory: apps/mobile
        run: flutter create --platforms=android,ios .
      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test
        working-directory: apps/mobile
        run: flutter test

  landing:
    name: Lint · Typecheck · Build (Landing)
    runs-on: ubuntu-latest
    # Standalone Cloudflare app (own pnpm root + lockfile, not in the workspace). Only run
    # when its code changes.
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    defaults:
      run:
        working-directory: munaxalanding
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: munaxalanding/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  demo:
    name: Lint · Typecheck · Build (Demo)
    runs-on: ubuntu-latest
    # Standalone Cloudflare app (own pnpm root + lockfile, not in the workspace). Only run
    # when its code changes.
    needs: changes
    if: needs.changes.outputs.demo == 'true'
    defaults:
      run:
        working-directory: munaxademo
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: munaxademo/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # NOTE: demo has no ESLint setup yet (no config/deps — its `lint` script is leftover
      # `next lint` scaffolding), so lint is omitted here. Typecheck + build still gate types
      # and Next's build-time checks. Add an ESLint config (mirroring munaxalanding) to enable it.
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod || true
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
