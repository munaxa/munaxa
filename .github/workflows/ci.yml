name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  node:
    name: Lint · Typecheck · Test · Build (JS/TS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: munaxa
          POSTGRES_PASSWORD: munaxa_ci
          POSTGRES_DB: munaxa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U munaxa"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Runtime/tests connect as the restricted, NOBYPASSRLS app role so RLS is enforced.
      DATABASE_URL: postgresql://munaxa_app:munaxa_app_dev@localhost:5432/munaxa?schema=public
      # Migrations connect as the privileged owner.
      DIRECT_DATABASE_URL: postgresql://munaxa:munaxa_ci@localhost:5432/munaxa?schema=public
      # psql rejects the Prisma-specific "schema" query param; use a clean libpq URI.
      PSQL_DIRECT_URL: postgresql://munaxa:munaxa_ci@localhost:5432/munaxa
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Build internal packages
        run: pnpm turbo run build --filter=@munaxa/domain --filter=@munaxa/contracts --filter=@munaxa/utils

      - name: Apply database migrations
        run: pnpm --filter @munaxa/api prisma:deploy

      - name: Provision restricted application role
        run: psql "$PSQL_DIRECT_URL" -v ON_ERROR_STOP=1 -f infra/postgres/app-role.sql

      - name: Seed database
        run: pnpm --filter @munaxa/api db:seed

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Integration tests (DB / RLS)
        run: pnpm --filter @munaxa/api test:e2e

      - name: Build
        run: pnpm build

  flutter:
    name: Analyze · Test (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare platform folders
        working-directory: apps/mobile
        run: flutter create --platforms=android,ios .
      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test
        working-directory: apps/mobile
        run: flutter test

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod || true
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
