name: Deploy Cloudflare

# munaxa.com runs on the Cloudflare Worker named `munaxa`, built from apps/web with OpenNext.
#
# Every merge to `main` redeploys, with no path filtering: the site renders its UI from
# `@munaxa/ui`, so "nothing it consumes changed" is not a judgement a path filter can make.
# A redundant deploy costs one short build; a skipped one costs a silently stale site.
#
# Before the first run:
#   - repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, in a `production`
#     environment;
#   - the Worker secret RESEND_API_KEY (`pnpm --filter @corporate/web exec wrangler secret put
#     RESEND_API_KEY`), without which the demo forms refuse and ask visitors to email instead;
#   - nothing else deploying to the `munaxa` Worker: no Git connection under the Worker's
#     Settings → Builds in the Cloudflare dashboard. (munaxa-school's own deploy targets
#     `munaxademo` and asserts it never targets `munaxa`.)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race. Do not cancel in progress: a half-finished `wrangler deploy` that
# loses to a newer run is worse than waiting.
concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'
  WORKER: munaxa
  CONFIG: apps/web/wrangler.jsonc

jobs:
  deploy:
    name: Deploy apps/web → munaxa
    runs-on: ubuntu-latest
    environment: production
    # Installing pulls @munaxa/* from GitHub Packages, which contents:read alone cannot download.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      # A `name` that does not match the real Worker does not fail the deploy: wrangler creates a
      # new Worker that no custom domain points at, and the live site never changes.
      - name: Assert the config targets the expected Worker
        run: |
          actual=$(grep -oP '^\s*"name":\s*"\K[^"]+' "$CONFIG" | head -1)
          if [ "$actual" != "$WORKER" ]; then
            echo "::error file=$CONFIG::Worker name is \"$actual\" but this site deploys to \"$WORKER\"."
            exit 1
          fi
          echo "$actual ✓"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & deploy
        run: pnpm --filter @corporate/web run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Search-console ownership tokens, inlined into the prerendered pages at build time.
          # Set them as repository variables; unset means no verification tag is rendered.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      # Tell IndexNow engines (Bing, Yandex, Naver, Seznam, Yep; not Google) that the site
      # changed, so they re-crawl now instead of on their own schedule. The key is public by
      # design: apps/web/public/<INDEXNOW_KEY>.txt proves we own the host. Submits whatever the
      # live sitemap lists, so new pages are picked up without editing this step. A failure here
      # only warns: the deploy itself already succeeded.
      - name: Notify IndexNow
        env:
          SITE: https://www.munaxa.com
          INDEXNOW_KEY: 8fe5b07def9c523317c389940a3ae656
        run: |
          set -euo pipefail
          if ! curl -fsS "$SITE/$INDEXNOW_KEY.txt" | grep -qx "$INDEXNOW_KEY"; then
            echo "::warning::IndexNow key file is not live at $SITE/$INDEXNOW_KEY.txt; skipping."
            exit 0
          fi
          urls=$(curl -fsS "$SITE/sitemap.xml" | grep -oP '(?<=<loc>)[^<]+' | jq -R . | jq -sc .)
          body=$(jq -nc --arg host "${SITE#https://}" --arg key "$INDEXNOW_KEY" \
            --arg loc "$SITE/$INDEXNOW_KEY.txt" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')
          echo "$body" | jq .
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data "$body")
          echo "IndexNow responded $status"
          case "$status" in
            200|202) ;;
            *) echo "::warning::IndexNow returned $status (see https://www.indexnow.org/documentation)." ;;
          esac
