name: Deploy

# Foundation pipeline (Phase 1). Concrete cloud steps are filled in during Phase 15
# (Production Hardening). Deploys are gated: staging on merge to main, production manual.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-images:
    name: Build & push container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t munaxa-api:${{ github.sha }} .
      - name: Build Admin image
        run: docker build -f apps/admin/Dockerfile -t munaxa-admin:${{ github.sha }} .
      # Registry login + push are added in Phase 15 once cloud credentials/secrets are provisioned.

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: build-images
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v6
      - name: Placeholder — prisma migrate deploy
        run: echo "Run 'pnpm --filter @munaxa/api prisma:deploy' against the target DB (Phase 15 wires secrets)."

  deploy:
    name: Deploy services
    runs-on: ubuntu-latest
    needs: migrate
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Placeholder — blue/green deploy
        run: echo "Deploy API (ECS/EKS) + Admin (Cloudflare) with health-gated cutover (Phase 15)."
