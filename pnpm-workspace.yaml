# AXA ecosystem workspace. One pnpm root so every product resolves the shared platform
# and the shared tooling configs through `workspace:*` instead of a published registry.
#
# `school/munaxadesignsystem` and `school/orbix-studio` are deliberately NOT members: they are
# standalone Cloudflare apps with their own pnpm roots and lockfiles (see school/README.md).
packages:
  - 'tooling/*'
  - 'platform'
  - 'school/apps/api'
  - 'school/apps/admin'
  - 'school/munaxademo'
  - 'school/landing'
  - 'school/packages/*'
