# AXA ecosystem workspace. One pnpm root so every product resolves the shared platform
# and the shared tooling configs through `workspace:*` instead of a published registry.
packages:
  - 'tooling/*'
  - 'platform'
  - 'school/apps/api'
  - 'school/apps/admin'
  - 'school/munaxademo'
  - 'school/landing'
  - 'school/packages/*'
