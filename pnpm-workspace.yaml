# AXA ecosystem workspace. One pnpm root so every product resolves the shared platform
# and the shared tooling configs through `workspace:*` instead of a published registry.
#
# `school/orbix-studio` is deliberately NOT a member: it is a standalone Cloudflare app with its
# own pnpm root and lockfile (see school/README.md).
packages:
  - 'tooling/*'
  - 'platform'
  - 'school/apps/api'
  - 'school/apps/admin'
  - 'school/munaxademo'
  - 'school/landing'
  - 'school/packages/*'
